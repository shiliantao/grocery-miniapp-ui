<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>满利到家 · 三版 UI 预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23176b4d'/%3E%3Cpath d='M24 7C13 7 8 13 8 22c8 1 15-3 16-15Z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--ink:oklch(.25 .025 165);--muted:oklch(.52 .018 165);--paper:oklch(.985 .008 110);--ground:oklch(.955 .012 135);--line:oklch(.88 .018 145);--green:oklch(.43 .10 163);--green-soft:oklch(.94 .025 155);--orange:oklch(.64 .17 43);--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}body{font:16px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--ground);min-height:100dvh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{opacity:.35;cursor:not-allowed}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.topbar{min-height:72px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--green);color:var(--paper);display:grid;place-items:center}.brand h1{font-size:18px;line-height:1.25}.brand p{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px}.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;transition:background .18s,transform .18s}.icon-btn:hover{background:var(--green-soft)}.icon-btn:active{transform:scale(.95)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100dvh - 72px)}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:22px 16px;overflow:auto}.side-label{font-size:12px;color:var(--muted);margin:0 8px 10px}.versions{display:grid;gap:8px;margin-bottom:24px}.version{border:1px solid var(--line);background:transparent;border-radius:12px;text-align:left;padding:12px;display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:center;transition:background .18s,border-color .18s}.version:hover{background:var(--green-soft)}.version.active{border-color:var(--green);background:var(--green-soft)}.swatch{width:14px;height:36px;border-radius:7px}.version strong{display:block;font-size:14px}.version small{display:block;color:var(--muted);font-size:11px}.pages{display:grid;gap:3px}.page-btn{min-height:40px;padding:8px 10px;border:0;border-radius:9px;background:transparent;text-align:left;font-size:13px;display:flex;gap:10px;align-items:center}.page-btn span{color:var(--muted);font-variant-numeric:tabular-nums}.page-btn:hover{background:var(--ground)}.page-btn.active{background:var(--green);color:var(--paper)}.page-btn.active span{color:var(--paper)}.workspace{padding:24px;min-width:0}.workspace-head{max-width:1050px;margin:0 auto 20px;display:flex;align-items:end;justify-content:space-between;gap:16px}.workspace-head h2{font-size:24px;line-height:1.3}.workspace-head p{font-size:13px;color:var(--muted)}.counter{font-size:14px;color:var(--muted);white-space:nowrap}.stage{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:center}.phone-zone{min-height:690px;border-radius:24px;background:oklch(.91 .018 145);display:grid;place-items:center;padding:24px;overflow:auto}.phone{width:100%;max-width:390px;aspect-ratio:390/844;background:var(--paper);border-radius:30px;padding:7px;box-shadow:0 20px 50px oklch(.25 .03 165/.16);position:relative}.phone:before{content:"";position:absolute;width:72px;height:16px;background:var(--ink);border-radius:0 0 12px 12px;top:7px;left:50%;transform:translateX(-50%);z-index:2}.phone img{width:100%;height:100%;object-fit:contain;border-radius:24px}.details h3{font-size:18px;margin-bottom:8px}.details>p{font-size:14px;color:var(--muted);margin-bottom:20px}.meta{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;font-size:13px}.meta span{color:var(--muted)}.nav-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.nav-btn{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px}.nav-btn.primary{background:var(--green);color:var(--paper);border-color:var(--green)}.hint{font-size:12px!important;margin:16px 0 0!important}.mobile-menu{display:none}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;inset:72px auto 0 0;width:min(310px,88vw);z-index:4;transform:translateX(-105%);transition:transform .2s ease-out;box-shadow:12px 0 30px oklch(.25 .03 165/.12)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid}.stage{grid-template-columns:1fr}.details{max-width:390px;width:100%;margin:auto}.phone-zone{min-height:0;padding:16px}.workspace{padding:18px 12px}.workspace-head{align-items:center}.workspace-head h2{font-size:20px}.topbar{padding:10px 12px}.brand p{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="打开页面目录"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M19 4C10 4 5 9 5 16c5 1 12-1 14-12Z"/><path d="M5 20c2-6 6-9 11-12"/></svg></div><div><h1>满利到家 · UI 设计预览</h1><p>县域生鲜与日用品配送平台</p></div></div>
  <div class="top-actions"><button class="icon-btn" id="prevTop" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon-btn" id="nextTop" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar"><p class="side-label">选择视觉方案</p><div class="versions" id="versions"></div><p class="side-label">页面目录 · 25 页</p><nav class="pages" id="pages" aria-label="页面目录"></nav></aside>
<main class="workspace"><div class="workspace-head"><div><h2 id="pageTitle"></h2><p id="variantDesc"></p></div><div class="counter" id="counter"></div></div><div class="stage"><div class="phone-zone"><div class="phone"><img id="preview" alt="页面预览"></div></div><section class="details"><h3>页面信息</h3><p>静态高保真预览，点击目录或使用键盘左右方向键翻页。</p><div class="meta"><span>当前方案</span><strong id="metaVariant"></strong></div><div class="meta"><span>画布尺寸</span><strong>390 × 844</strong></div><div class="meta"><span>页面编号</span><strong id="metaPage"></strong></div><div class="nav-buttons"><button class="nav-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>上一页</button><button class="nav-btn primary" id="nextBtn">下一页<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div><p class="hint">预览图片仅用于选版与审阅，源文件仍保留可编辑文本和组件。</p></section></div></main>
</div>
